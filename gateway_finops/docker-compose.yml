# Small LLM gateway: LiteLLM proxy + Postgres (Postgres holds virtual keys, teams, budgets and spend logs).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 2s
      retries: 30

  gateway:
    # main-stable as pulled on 2026-10-08 = LiteLLM 1.104.2
    image: ghcr.io/berriai/litellm@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-master-demo}
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your shell or .env}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      STORE_MODEL_IN_DB: "False"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
