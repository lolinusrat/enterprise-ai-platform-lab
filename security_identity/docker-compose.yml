# Policy decision point. Loads ./policies; the app pushes policy data (incl. the grant-signing JWKS) to /v1/data/secagent.
#   docker compose up -d
services:
  opa:
    image: openpolicyagent/opa:1.10.1
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=error", "/policies"]
    ports:
      - "8182:8181"
    volumes:
      - ./policies:/policies:ro
