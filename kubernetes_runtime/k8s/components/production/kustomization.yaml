# Settings every production cluster shares, whichever cloud it runs on.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: Deployment, name: agent-api}
    patch: |
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1                      # survive the loss of a zone
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector: {matchLabels: {app: agent-api}}
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: {matchLabels: {app: agent-api}}
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {memory: 1Gi}             # memory limit only: no CPU throttling
  - target: {kind: HorizontalPodAutoscaler, name: agent-api}
    patch: |
      - {op: replace, path: /spec/minReplicas, value: 3}     # one per zone
      - {op: replace, path: /spec/maxReplicas, value: 30}
      - {op: replace, path: /spec/behavior/scaleDown/stabilizationWindowSeconds, value: 300}
  - target: {kind: PodDisruptionBudget, name: agent-api}
    patch: |
      - op: replace
        path: /spec
        value:
          maxUnavailable: 1
          selector: {matchLabels: {app: agent-api}}
