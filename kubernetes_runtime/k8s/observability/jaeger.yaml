# Jaeger all-in-one with in-memory storage: fine for a demo, lost on restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
          readinessProbe:
            httpGet: {path: /, port: ui}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  type: NodePort
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui, nodePort: 30686}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
