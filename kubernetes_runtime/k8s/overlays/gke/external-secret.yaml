# Secret Manager secrets (CMEK-encrypted) synced into the agent-secrets Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secrets
  namespace: agent
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: gcp-secret-manager}
  target: {name: agent-secrets, creationPolicy: Owner}
  data:
    - {secretKey: api-token, remoteRef: {key: agent-api-token}}
    - {secretKey: api-token-previous, remoteRef: {key: agent-api-token-previous}}
    - {secretKey: groq-api-key, remoteRef: {key: agent-groq-api-key}}
