# Global external Application Load Balancer via the GKE Gateway controller. Backends are
# container-native NEGs (pod IPs), health-checked on /readyz, protected by Cloud Armor.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agent-api
  namespace: agent
  annotations:
    networking.gke.io/certmap: agent-api-certmap          # Certificate Manager, Google-managed cert
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - {name: https, protocol: HTTPS, port: 443}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-api
  namespace: agent
spec:
  parentRefs: [{name: agent-api}]
  hostnames: [agent.example.com]
  rules:
    - backendRefs: [{name: agent-api, port: 80}]
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: agent-api
  namespace: agent
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck: {port: 8000, requestPath: /readyz}
  targetRef: {group: "", kind: Service, name: agent-api}
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: agent-api
  namespace: agent
spec:
  default:
    securityPolicy: agent-api-armor                       # Cloud Armor policy
    connectionDraining: {drainingTimeoutSec: 20}
  targetRef: {group: "", kind: Service, name: agent-api}
