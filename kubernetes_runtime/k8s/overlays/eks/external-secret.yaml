# Secrets Manager entry "prod/agent-api" (KMS-encrypted) synced into the agent-secrets Secret.
# Rotate in Secrets Manager; ESO refreshes the Secret and the kubelet updates the mounted files.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-secrets
  namespace: agent
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: agent-secrets, creationPolicy: Owner}
  data:
    - {secretKey: api-token, remoteRef: {key: prod/agent-api, property: api-token}}
    - {secretKey: api-token-previous, remoteRef: {key: prod/agent-api, property: api-token-previous}}
    - {secretKey: groq-api-key, remoteRef: {key: prod/agent-api, property: groq-api-key}}
