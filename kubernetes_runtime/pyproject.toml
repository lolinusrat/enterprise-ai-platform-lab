[project]
name = "kubernetes-runtime"
version = "0.1.0"
description = "Agent API deployed to Kubernetes with autoscaling, probes, secrets and telemetry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "openai>=3.26.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
ui = [
    "httpx>=0.28.1",
]
