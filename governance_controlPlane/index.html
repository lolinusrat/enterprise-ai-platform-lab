"use strict";
/* ---------- tiny SHA-256 (sync) for the hash-chained audit ledger ---------- */
const sha256=(()=>{
  const primes=[];for(let n=2;primes.length<64;n++){if(primes.every(p=>n%p))primes.push(n)}
  const frac=x=>((x-Math.floor(x))*0x100000000)>>>0;
  const K=primes.map(p=>frac(Math.cbrt(p))), H0=primes.slice(0,8).map(p=>frac(Math.sqrt(p)));
  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  return str=>{
    const b=new TextEncoder().encode(str), l=b.length, len=((l+9+63)>>6)<<6;
    const m=new Uint8Array(len);m.set(b);m[l]=0x80;
    const dv=new DataView(m.buffer);dv.setUint32(len-4,(l*8)>>>0);dv.setUint32(len-8,Math.floor(l/0x20000000));
    const H=H0.slice(), w=new Uint32Array(64);
    for(let i=0;i<len;i+=64){
      for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
      for(let t=16;t<64;t++){const a=w[t-15],c=w[t-2];w[t]=(w[t-16]+(r(a,7)^r(a,18)^(a>>>3))+w[t-7]+(r(c,17)^r(c,19)^(c>>>10)))>>>0}
      let[a,bb,c,d,e,f,g,h]=H;
      for(let t=0;t<64;t++){
        const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[t]+w[t])>>>0;
        const t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;
        h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
      }
      [a,bb,c,d,e,f,g,h].forEach((v,k)=>H[k]=(H[k]+v)>>>0);
    }
    return H.map(x=>x.toString(16).padStart(8,"0")).join("");
  };
})();

const nowIso=()=>{clock+=37000+Math.floor(Math.random()*90000);return new Date(clock).toISOString().slice(0,19)+"Z"};

/* ---------- audit ledger: append-only, hash chained ---------- */
const evBody=e=>JSON.stringify([e.seq,e.ts,e.kind,e.bu,e.agent,e.actor,e.action,e.decision,e.rule,e.detail]);
function appendAudit(e){
  const prev=state.audit.length?state.audit[state.audit.length-1].hash:"0".repeat(64);
  const ev={seq:state.audit.length+1,ts:nowIso(),...e,prev};
  ev.hash=sha256(prev+"|"+evBody(ev));
  state.audit.push(ev);state.chain=null;return ev;
}
function verifyChain(){
  let prev="0".repeat(64);
  for(const e of state.audit){
    if(e.prev!==prev||sha256(prev+"|"+evBody(e))!==e.hash)return{ok:false,seq:e.seq,n:state.audit.length};
    prev=e.hash;
  }
  return{ok:true,n:state.audit.length,head:prev};
}

/* ---------- admission: deploy-time checks ---------- */
function deriveRisk(d){
  let score=0;const why=[];
  if(d.cls===3){score+=2;why.push("Restricted data +2")}else if(d.cls===2){score+=1;why.push("Confidential data +1")}
  const writes=d.tools.filter(t=>TOOLS[t].mode==="write");
  if(writes.length){score+=1;why.push("write tools +1")}
  if(writes.some(t=>TOOLS[t].cls===3)){score+=1;why.push("writes to Restricted systems +1")}
  if(d.customerFacing){score+=1;why.push("customer-facing +1")}
  return{score,tier:score>=3?"high":score>=1?"medium":"low",why:why.join(", ")||"no risk factors"};
}
function admit(d){
  const bu=BUS[d.bu], C=[];
  const add=(id,label,status,detail,rule)=>C.push({id,label,status,detail,rule});
  const exists=state.agents.some(a=>a.bu===d.bu&&a.name===d.name);
  if(!/^[a-z][a-z0-9-]{2,30}$/.test(d.name))add("A1","Ownership & identity","fail","Agent name must be 3 to 31 lowercase letters, digits or hyphens.","GR-01");
  else if(exists)add("A1","Ownership & identity","fail",`${d.bu}/${d.name} is already registered. Pick another name.`,"GR-01");
  else if(!/^[^@\s]+@corp\.example$/.test(d.owner))add("A1","Ownership & identity","fail","Owner must be a named corp.example mailbox, not a team alias or blank.","GR-01");
  else add("A1","Ownership & identity","pass",`Owner ${d.owner}. Identity on admission: ${spiffe(d)}`,"GR-01");

  const dep=d.models.filter(m=>MODELS[m].status!=="active");
  if(!d.models.length)add("A2","Model catalog","fail","Choose at least one model.","GR-02");
  else if(dep.length)add("A2","Model catalog","fail",`${list(dep)} is deprecated in the enterprise catalog. New deployments cannot use it.`,"GR-02");
  else add("A2","Model catalog","pass","Every model is active in the enterprise catalog.","GR-02");

  const notEnt=d.models.filter(m=>!bu.models.includes(m));
  if(notEnt.length)add("A3","BU model entitlement","fail",`${bu.name} is not entitled to ${list(notEnt)}. A BU policy narrows the catalog; it cannot widen it.`,"GR-02");
  else if(d.models.length)add("A3","BU model entitlement","pass",`All models are on ${bu.name}'s entitlement list.`,"GR-02");
  else add("A3","BU model entitlement","fail","No models chosen.","GR-02");

  if(d.cls>bu.maxClass)add("A4","Data clearance","fail",`${bu.name} caps agents at ${CLASSES[bu.maxClass]}; this manifest declares ${CLASSES[d.cls]}.`,"GR-03");
  else{
    const ok=d.models.filter(m=>MODELS[m].maxClass>=d.cls), low=d.models.filter(m=>MODELS[m].maxClass<d.cls);
    if(!d.models.length)add("A4","Data clearance","fail","No models to check.","GR-03");
    else if(!ok.length)add("A4","Data clearance","fail",`No chosen model is cleared for ${CLASSES[d.cls]} data. Add an in-boundary model such as gpt-oss-120b.`,"GR-03");
    else if(low.length)add("A4","Data clearance","warn",`${list(low)} is cleared only to ${CLASSES[Math.max(...low.map(m=>MODELS[m].maxClass))]}. The gateway will route ${CLASSES[d.cls]} prompts to ${list(ok)}.`,"GR-03");
    else add("A4","Data clearance","pass",`Every model is cleared for ${CLASSES[d.cls]} data.`,"GR-03");
  }

  const notTool=d.tools.filter(t=>!bu.tools.includes(t)), over=d.tools.filter(t=>TOOLS[t].cls>d.cls);
  if(notTool.length)add("A5","Tool scope","fail",`${list(notTool)} is not approved for ${bu.name}.`,"GR-03");
  else if(over.length)add("A5","Tool scope","fail",`${list(over)} returns ${CLASSES[Math.max(...over.map(t=>TOOLS[t].cls))]} data, above the agent's ${CLASSES[d.cls]} ceiling.`,"GR-03");
  else add("A5","Tool scope","pass",d.tools.length?`${d.tools.length} tool${d.tools.length>1?"s":""}, all approved for ${bu.name} and within the data ceiling.`:"No tools. Model-only agent.","GR-03");

  const r=deriveRisk(d), tier=TIERS[Math.max(TIERS.indexOf(d.tier),TIERS.indexOf(r.tier))];
  if(TIERS.indexOf(d.tier)<TIERS.indexOf(r.tier))add("A6","Risk tier","fail",`Declared ${d.tier}, but the manifest scores ${r.score} (${r.why}), which is ${r.tier}.`,"GR-09");
  else add("A6","Risk tier","pass",`Declared ${d.tier}; derived ${r.tier} (score ${r.score}: ${r.why}).`,"GR-09");

  const need=tier==="high"?0.9:tier==="medium"?0.85:null;
  if(need===null)add("A7","Evaluation evidence","pass","Not required at low tier.","GR-09");
  else if(d.evalScore==null||!(d.evalScore>=need))add("A7","Evaluation evidence","fail",`${tier} tier needs an enterprise-safety-v3 score of at least ${need}; got ${d.evalScore??"none"}.`,"GR-09");
  else add("A7","Evaluation evidence","pass",`enterprise-safety-v3 score ${d.evalScore} meets the ${need} bar for ${tier} tier.`,"GR-09");

  const writes=d.tools.filter(t=>TOOLS[t].mode==="write");
  if(tier==="high"&&writes.length&&!d.hitl)add("A8","Human oversight","fail",`High-risk agent with write tools (${list(writes)}) must send writes to a human approver.`,"GR-06");
  else if(writes.length&&d.hitl)add("A8","Human oversight","pass",`Writes (${list(writes)}) go to a human approver.`,"GR-06");
  else if(writes.length)add("A8","Human oversight","pass",`Writes (${list(writes)}) run unattended, which ${tier} tier allows.`,"GR-06");
  else add("A8","Human oversight","pass","No write tools.","GR-06");

  const free=bu.budget-allocated(d.bu);
  if(!(d.tokens>0))add("A9","Budget allocation","fail","Request a monthly token allocation.","GR-07");
  else if(d.tokens>free)add("A9","Budget allocation","fail",`Requests ${d.tokens}M tokens a month; ${bu.name} has ${free}M unallocated of ${bu.budget}M.`,"GR-07");
  else add("A9","Budget allocation","pass",`${d.tokens}M tokens a month from ${free}M unallocated.`,"GR-07");

  if(tier==="high")add("A10","Approval","pending","Risk Office sign-off needed. No identity is issued until then.","GR-09");
  else add("A10","Approval","pass",`Auto-approved at ${tier} tier.`,"GR-09");

  const failed=C.some(c=>c.status==="fail");
  return{checks:C,outcome:failed?"rejected":tier==="high"?"pending":"admitted",tier};
}

/* ---------- runtime: one request through the enforcement points ---------- */
function simulate(q){
  const a=agentById(q.agent), u=USERS[q.user], bu=BUS[a.bu], steps=[];
  let stop=false;
  const add=(comp,check,status,detail,rule)=>{steps.push({comp,check,status,detail,rule});if(status==="deny"||status==="hold")stop=status==="deny"};
  add("Agent Gateway","Authenticate user","pass",`OIDC token for ${q.user} verified (issuer idp.corp.example, MFA satisfied).`,"GR-01");
  if(a.status==="suspended")add("Agent Gateway","Authenticate agent","deny",`${aid(a)} is suspended. Its SVID was revoked, so the gateway refuses the mTLS session.`,"GR-01");
  else if(a.status!=="active")add("Agent Gateway","Authenticate agent","deny",`${aid(a)} is ${a.status}; no SVID has been issued.`,"GR-09");
  else add("Agent Gateway","Authenticate agent","pass",`mTLS with ${spiffe(a)}; policy bundle ${a.bundle} loaded.`,"GR-01");
  if(!stop){
    if(u.bu!==a.bu)add("Policy Decision Point","Audience","deny",`${q.user} is in ${BUS[u.bu].name}; ${aid(a)} serves ${bu.name} only.`,"GR-10");
    else add("Policy Decision Point","Audience","pass",`${q.user} (${u.role}) is in ${bu.name}, the agent's audience.`,"GR-10");
  }
  if(!stop){
    const scopes=a.tools.filter(t=>u.groups.includes(TOOLS[t].ent)), dropped=a.tools.filter(t=>!scopes.includes(t));
    add("Identity Broker","On-behalf-of token exchange","pass",`Scopes granted: ${scopes.length?list(scopes):"none"}.${dropped.length?` Dropped because ${q.user} lacks them: ${list(dropped)}.`:""}`,"GR-05");
    q._scopes=scopes;
  }
  let served=null;
  if(!stop&&q.kind==="model"){
    let m=q.model;
    if(!a.models.includes(m))add("Model Gateway","Model entitlement","deny",`${m} is not in ${aid(a)}'s manifest.`,"GR-02");
    else if(!bu.models.includes(m)||MODELS[m].status!=="active")add("Model Gateway","Model entitlement","deny",`${m} is not available to ${bu.name}.`,"GR-02");
    else add("Model Gateway","Model entitlement","pass",`${m} is in the manifest, the BU entitlement and the active catalog.`,"GR-02");
    if(!stop){
      if(q.cls>a.cls)add("Model Gateway","Data classification","deny",`Prompt classified ${CLASSES[q.cls]}; the agent's ceiling is ${CLASSES[a.cls]}.`,"GR-03");
      else if(q.cls>MODELS[m].maxClass){
        const alt=a.models.find(x=>MODELS[x].maxClass>=q.cls&&bu.models.includes(x)&&MODELS[x].status==="active");
        if(alt){add("Model Gateway","Data classification","warn",`${m} is cleared to ${CLASSES[MODELS[m].maxClass]}. Rerouted to ${alt} (${MODELS[alt].hosting}).`,"GR-03");m=alt}
        else add("Model Gateway","Data classification","deny",`${m} is cleared to ${CLASSES[MODELS[m].maxClass]} and the agent has no model cleared for ${CLASSES[q.cls]}.`,"GR-03");
      }else add("Model Gateway","Data classification","pass",`${CLASSES[q.cls]} prompt is within the agent ceiling and ${m}'s clearance.`,"GR-03");
    }
    if(!stop){
      const ext=MODELS[m].hosting==="external";
      if(q.pii&&ext)add("Model Gateway","PII redaction","warn",`Redacted 3 entities (person name, account number, phone) before sending to ${MODELS[m].provider}.`,"GR-04");
      else if(q.pii)add("Model Gateway","PII redaction","pass",`${m} runs inside the boundary; personal data may stay in the prompt at this class.`,"GR-04");
      else add("Model Gateway","PII redaction","pass","No personal data detected.","GR-04");
    }
    if(!stop){
      const pct=bu.used/bu.budget;
      if(pct>=1)add("Model Gateway","Budget","deny",`${bu.name} has used its ${bu.budget}M token allocation.`,"GR-07");
      else if(pct>=.85)add("Model Gateway","Budget","warn",`${bu.used}M of ${bu.budget}M tokens used (${Math.round(pct*100)}%). BU admin alerted at 85%.`,"GR-07");
      else add("Model Gateway","Budget","pass",`${bu.used}M of ${bu.budget}M tokens used (${Math.round(pct*100)}%). Spend metered to ${aid(a)}.`,"GR-07");
      served=m;
    }
  }
  if(!stop&&q.kind==="tool"){
    const t=TOOLS[q.tool];
    if(!a.tools.includes(q.tool))add("Tool Gateway","Manifest scope","deny",`${q.tool} is not declared in ${aid(a)}'s manifest.`,"GR-02");
    else add("Tool Gateway","Manifest scope","pass",`${q.tool} is declared in the manifest.`,"GR-02");
    if(!stop){
      if(!q._scopes.includes(q.tool))add("Tool Gateway","On-behalf-of scope","deny",`${q.user} is not in group ${t.ent}, so the token carries no ${q.tool} scope. The agent cannot do what its user cannot.`,"GR-05");
      else add("Tool Gateway","On-behalf-of scope","pass",`${q.user} holds ${t.ent}; token carries ${q.tool}.`,"GR-05");
    }
    if(!stop)add("Tool Gateway","Data classification","pass",`${t.sys} returns ${CLASSES[t.cls]} data, within the ${CLASSES[a.cls]} ceiling.`,"GR-03");
    if(!stop){
      if(t.mode==="write"&&(a.tier==="high"||a.hitl))add("Tool Gateway","Human oversight","hold",`Write to ${t.sys} queued for a second approver in the ${bu.name} case queue. The requester cannot approve it.`,"GR-06");
      else if(t.mode==="write")add("Tool Gateway","Human oversight","pass",`Write allowed unattended at ${a.tier} tier.`,"GR-06");
      else add("Tool Gateway","Human oversight","pass","Read-only call.","GR-06");
    }
  }
  const deny=steps.find(s=>s.status==="deny"), hold=steps.find(s=>s.status==="hold"), warn=steps.filter(s=>s.status==="warn");
  const decision=deny?"deny":hold?"hold":warn.length?"obligations":"allow";
  const key=deny||hold||warn[0]||steps[steps.length-1];
  const action=q.kind==="model"?`model.call ${q.model}${served&&served!==q.model?` → ${served}`:""} [${CLASSES[q.cls]}${q.pii?", PII":""}]`:`tool.call ${q.tool}`;
  const ev=appendAudit({kind:"runtime",bu:a.bu,agent:aid(a),actor:q.user,action,decision,rule:key.rule,detail:key.detail});
  steps.push({comp:"Audit Ledger",check:"Record decision","status":"pass",detail:`Event #${ev.seq} appended and chained to #${ev.seq-1} (${ev.hash.slice(0,12)}…).`,rule:"GR-08"});
  return{steps,decision,key,ev,q:{...q}};
}

}

function seqSvg(lanes,msgs){

function viewAudit(){
  const plat=state.persona==="platform";
  let ev=state.audit.filter(e=>plat||e.bu===state.persona);
  if(state.auditBu!=="all"&&plat)ev=ev.filter(e=>e.bu===state.auditBu);
  if(state.auditDecision!=="all")ev=ev.filter(e=>e.decision===state.auditDecision);
  const c=state.chain;
  const decs=[...new Set(state.audit.map(e=>e.decision))];
  return `
  <section class="view">
    <div style="display:grid;gap:6px"><p class="eyebrow">Evidence</p><h2>Audit ledger</h2>
      <p class="lede">Every admission, control action and runtime decision${LIVE?" (one event per gateway hop, stored in SQLite with append-only triggers)":""}, each SHA-256 chained to the one before. Editing any past event breaks every hash after it. ${plat?"":"BU admins see their own BU's events."}</p></div>
    <div class="tiles">
      <div class="tile"><span>Events</span><b>${state.audit.length}</b></div>
      <div class="tile"><span>Denied</span><b>${state.audit.filter(e=>e.decision==="deny").length}</b></div>
      <div class="tile"><span>Held</span><b>${state.audit.filter(e=>e.decision==="hold").length}</b></div>
      <div class="tile"><span>Chain head</span><b style="font-size:16px;padding-top:6px">${state.audit.at(-1).hash.slice(0,10)}…</b></div>
    </div>
    <div class="panel">
      <div class="toolbar">
        ${plat?`<label class="small" for="a-bu">BU</label><select id="a-bu" data-act-change="auditBu"><option value="all">All</option>${Object.entries(BUS).map(([k,b])=>`<option value="${k}" ${k===state.auditBu?"selected":""}>${b.name}</option>`).join("")}</select>`:""}
        <label class="small" for="a-dec">Decision</label><select id="a-dec" data-act-change="auditDecision"><option value="all">All</option>${decs.map(d=>`<option value="${d}" ${d===state.auditDecision?"selected":""}>${DECISION_LABEL[d]||d}</option>`).join("")}</select>
        <span style="margin-left:auto" class="row-actions">
          <button class="btn sm" data-act="verify">Verify chain</button>
          ${plat?(state.tamper?`<button class="btn ghost sm" data-act="untamper">Undo tampering</button>`:`<button class="btn ghost sm" data-act="tamper">Tamper with a denial</button>`):""}
        </span>
      </div>
      ${c?`<div class="chain ${c.ok?"pass":"fail"}">${c.ok?`Chain intact. ${c.n} events recomputed; head ${c.head.slice(0,16)}… matches.`:`Chain broken at event #${c.seq}. Its stored hash no longer matches its contents, so every later event is suspect. In production the ledger is write-once storage and this alerts the SIEM.`}</div>`:""}
      <div class="scroll"><table>
        <thead><tr><th>#</th><th>Time (UTC)</th><th>Type</th><th>Agent</th><th>Actor</th><th>Action</th><th>Decision</th><th>Rule</th><th>Hash</th></tr></thead>
        <tbody>${ev.slice().reverse().map(e=>`<tr class="${c&&!c.ok&&e.seq===c.seq?"broken":""}"><td class="num">${e.seq}</td><td class="num">${e.ts.slice(11,19)}</td><td class="small">${e.kind}</td><td class="agent-id">${esc(e.agent)}</td><td class="small">${esc(e.actor)}</td><td class="small" title="${esc(e.detail)}">${esc(e.action)}</td><td>${pill(e.decision,DECISION_LABEL[e.decision]||e.decision)}</td><td class="hash">${e.rule}</td><td class="hash" title="prev ${e.prev}">${e.hash.slice(0,10)}…</td></tr>`).join("")}</tbody>
      </table></div>
    </div>
  </section>`;
}

  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${state.tab===k}" data-act="tab" data-id="${k}">${l}</button>`).join("");
  $("#persona").innerHTML=Object.entries(PERSONAS).map(([k,l])=>`<option value="${k}" ${k===state.persona?"selected":""}>${l}</option>`).join("");
  $("#app").innerHTML=VIEWS[state.tab]();

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  const id=el.dataset.id;
  if(LIVE&&["deploy","suspend","reinstate","approve","reject","preset","run","verify","tamper","untamper"].includes(el.dataset.act)){liveAct(el.dataset.act,id);return}
  switch(el.dataset.act){
    case "tab":state.tab=id;try{history.replaceState(null,"","#"+id)}catch(_){}window.scrollTo(0,0);break;
    case "arch":state.archSel=id;break;
    case "flow":state.flow=id;break;
    case "draft":draft=structuredClone(DRAFTS[id].d);if(LIVE)liveDry();break;
    case "deploy":{const res=admit(draft);if(res.outcome==="rejected")return;const a=register(draft,res);toast(res.outcome==="pending"?`${aid(a)} registered as pending. Risk Office approves it in the Registry.`:`${aid(a)} admitted with bundle ${a.bundle}. It can take requests now.`);break}
    case "suspend":setStatus(id,"suspended","kill switch");toast(`${id} suspended. Its SVID is revoked.`);break;
    case "reinstate":setStatus(id,"active","reinstated");toast(`${id} reinstated.`);break;
    case "approve":setStatus(id,"active","Risk Office sign-off");toast(`${id} approved. SVID issued.`);break;
    case "reject":setStatus(id,"rejected","Risk Office rejected");toast(`${id} rejected.`);break;
    case "viewpolicy":policyAgent=id;state.tab="policy";break;
    case "preset":run=structuredClone(PRESETS[id]);state.lastRun=simulate(structuredClone(run));break;
    case "run":state.lastRun=simulate(structuredClone(run));toast(`Event #${state.lastRun.ev.seq} written to the ledger.`);break;
    case "verify":state.chain=verifyChain();break;
    case "tamper":{const t=state.audit.slice().reverse().find(x=>x.decision==="deny");if(!t)return;state.tamper={seq:t.seq,decision:t.decision};t.decision="allow";state.chain=null;toast(`Event #${t.seq} rewritten from Denied to Allowed. Now verify the chain.`);break}
    case "untamper":{const t=state.audit[state.tamper.seq-1];t.decision=state.tamper.decision;state.tamper=null;state.chain=null;break}
    default:return;
  }
  render();
});
document.addEventListener("keydown",e=>{const el=e.target.closest?.("[data-act='arch']");if(el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();el.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="persona"){state.persona=el.value;state.auditBu="all";if(state.persona!=="platform")draft.bu=state.persona;
    if(LIVE){refresh().then(()=>{liveDry();render()}).catch(err=>toast(err.message));return}
    render();return}
  if(el.dataset.actChange){const k=el.dataset.actChange;if(k==="policyAgent")policyAgent=el.value;else state[k]=el.value;state.chain=state.chain;render();return}
  if(el.dataset.f){
    const f=el.dataset.f;
    if(f==="models"||f==="tools"){const s=new Set(draft[f]);el.checked?s.add(el.value):s.delete(el.value);draft[f]=Object.keys(f==="models"?MODELS:TOOLS).filter(x=>s.has(x))}
    else if(f==="hitl"||f==="customerFacing")draft[f]=el.checked;
    else if(f==="cls")draft.cls=+el.value;
    else if(f==="evalScore")draft.evalScore=el.value===""?null:+el.value;
    else if(f==="tokens")draft.tokens=+el.value||0;
    else draft[f]=el.value.trim();
    if(LIVE)liveDry();
    render();return;
  }
  if(el.dataset.r){
    const f=el.dataset.r;
    if(f==="prompt")return;
    if(f==="pii")run.pii=el.checked;else if(f==="cls")run.cls=+el.value;else run[f]=el.value;
    if(f==="agent"){const a=agentById(run.agent);run.model=a.models[0];run.tool=a.tools[0]||"web.search"}
    render();
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.r==="prompt"){run.prompt=el.value;return}
  if(!el.dataset.f||el.type==="checkbox")return;
  if(["name","owner","purpose"].includes(el.dataset.f)){draft[el.dataset.f]=el.value.trim();if(LIVE)liveDry();render()}
});
const h=(location.hash||"").slice(1);if(VIEWS[h])state.tab=h;
render();
liveInit();
</script>
